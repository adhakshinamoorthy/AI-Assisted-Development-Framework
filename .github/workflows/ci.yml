name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Aide.slnx --locked-mode
      - run: dotnet build Aide.slnx -c Release --no-restore
      - run: dotnet test Aide.slnx -c Release --no-build --logger trx
      - run: dotnet list Aide.slnx package --vulnerable --include-transitive
