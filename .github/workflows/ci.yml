name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore Aide.slnx --locked-mode
      - run: dotnet format Aide.slnx --verify-no-changes --no-restore
      - run: dotnet build Aide.slnx -c Release --no-restore
      - run: dotnet test Aide.slnx -c Release --no-build --no-restore
      - run: dotnet list Aide.slnx package --vulnerable --include-transitive
      - run: docker compose config --quiet
